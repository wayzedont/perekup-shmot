<title>Перекуп шмота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone frame centered on a dark stage on desktop, full-bleed on phones. Home = night-street wallpaper with outlined ШМОТ; apps = light sheets, each with its own accent. Single deliberate look. */
:root{
  --ink:#17161a; --mute:#6f6b75; --line:#e7e4ea; --bg:#f3f2f5; --card:#ffffff;
  --good:#12855a; --bad:#d4342a; --warn:#b97709; --blue:#2a8bd9;
  --stage:#0c0b0f;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-disp:"Dela Gothic One","Golos Text",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--f-ui);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#stage{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% 40%,#1d1a24 0%,#0c0b0f 70%)}
#phone{position:relative;width:392px;height:min(846px,calc(100% - 28px));border-radius:50px;border:11px solid #050507;box-shadow:0 0 0 2px #2b2833,0 0 0 3px #0a090c,0 40px 90px rgba(0,0,0,.65);overflow:hidden;background:var(--bg)}
#phone::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#050507;z-index:60;pointer-events:none}
@media (max-width:520px),(max-height:640px){#phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}#phone::before{display:none}}
#screen{position:absolute;inset:0;overflow:hidden}
#status{position:absolute;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:6px 26px 0;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}
#status.light{color:#fff}
#status.dark{color:var(--ink);background:var(--card)}
#status .clock{pointer-events:auto;display:flex;gap:6px;align-items:center}
#status .r{display:flex;gap:6px;align-items:center}
#status .bat{width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;position:relative;opacity:.85}
#status .bat i{position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:60%;background:currentColor;border-radius:1px}
@media (max-width:520px),(max-height:640px){#status{padding:0 16px;height:40px}}
#homebar{position:absolute;bottom:0;left:0;right:0;height:22px;z-index:25;display:flex;justify-content:center;align-items:center}
#homebar button{width:134px;height:5px;border-radius:3px;background:rgba(20,20,24,.5)}
#homebar.light button{background:rgba(255,255,255,.8)}
/* HOME */
.home{position:absolute;inset:0;padding:54px 18px 120px;overflow:hidden;overscroll-behavior:none;touch-action:none;display:flex;flex-direction:column;color:#fff;
  background:
   radial-gradient(160px 120px at 85% 18%,rgba(255,92,140,.35),transparent 70%),
   radial-gradient(200px 140px at 10% 78%,rgba(70,180,255,.25),transparent 70%),
   linear-gradient(170deg,#191526 0%,#2a1d3a 40%,#3d2340 70%,#5a2b3a 100%)}
.home::before{content:"ШМОТ";position:absolute;right:0;top:300px;max-height:calc(100% - 300px);overflow:hidden;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-disp);font-size:150px;line-height:1;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.12);pointer-events:none;white-space:nowrap}
.widget{position:relative;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;padding:14px;display:grid;gap:10px;border:1px solid rgba(255,255,255,.14)}
.w-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;opacity:.72}
.w-money{font-family:var(--f-disp);font-size:34px;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.01em}
.w-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.w-stats{display:grid;gap:3px;font-size:11.5px;text-align:right;opacity:.88;min-width:0}
.w-btns{flex-wrap:nowrap}.w-btns button{flex:1;padding:7px 4px;white-space:nowrap}
.tips .tip:nth-child(n+4){display:none}
.tip{padding:8px 12px!important}
@media (max-height:720px){.tips .tip:nth-child(n+3){display:none}.home{padding-top:46px}}
@media (max-height:660px){.tips .tip:nth-child(n+2){display:none}}
@media (max-height:640px){.grid{gap:10px 6px;margin-top:12px}.ico .sq{width:50px;height:50px;border-radius:14px}.ico svg{width:26px;height:26px}.widget{padding:12px;gap:8px}.w-money{font-size:30px}.home{padding-bottom:104px}.dock{bottom:22px;padding:9px 8px}}
.w-sub{font-size:12.5px;opacity:.88;display:flex;gap:10px;flex-wrap:wrap}
.w-btns{display:flex;gap:6px;flex-wrap:wrap}
.w-btns button{background:rgba(255,255,255,.16);padding:7px 11px;border-radius:12px;font-size:12px;font-weight:600}
.w-btns button.sl{background:#fff;color:#21182c}
.grid{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;margin-top:16px}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.45);position:relative;min-width:0}
.ico span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico .sq{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;box-shadow:0 5px 14px rgba(0,0,0,.3)}
.ico svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-5px;right:calc(50% - 37px);min-width:20px;height:20px;border-radius:10px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;text-shadow:none}
.dock{position:absolute;left:12px;right:12px;bottom:28px;background:rgba(255,255,255,.15);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:30px;padding:12px 8px;display:grid;grid-template-columns:repeat(4,1fr)}
.dock .ico span{display:none}
.tips{position:relative;margin-top:12px;display:grid;gap:6px}
.tip{background:rgba(0,0,0,.28);border-radius:16px;padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center;text-align:left;color:#fff}
.tip svg{width:20px;height:20px;flex-shrink:0;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* APP */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:46px}
@media (max-width:520px),(max-height:640px){.app{padding-top:40px}#pull{height:38px}}
.ah{min-height:52px;display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.ah .bk{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;font-size:26px;line-height:1;color:var(--acc)}
.ah h1{font-family:var(--f-disp);font-weight:400;font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah .rt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--card);padding:0 12px 10px;border-bottom:1px solid var(--line);flex-shrink:0}
.tabs button{flex:1;padding:8px 4px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mute);background:var(--bg);position:relative}
.tabs button.on{background:var(--acc);color:var(--acc-ink,#fff)}
.tabs .n{display:inline-block;min-width:17px;height:17px;border-radius:9px;background:#ff3b30;color:#fff;font-size:10.5px;line-height:17px;margin-left:4px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 40px;display:flex;flex-direction:column;gap:10px}
.body>*{flex-shrink:0}
.af{background:var(--card);border-top:1px solid var(--line);padding:10px 12px 30px;display:grid;gap:8px;flex-shrink:0}
.card{background:var(--card);border-radius:18px;padding:14px;display:grid;gap:8px}
.card h3{margin:0;font-size:15px;font-weight:700}
.muted{color:var(--mute);font-size:12.5px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:13px;font-weight:600;font-size:14px;background:var(--acc,var(--blue));color:var(--acc-ink,#fff);text-align:center}
.btn.sec{background:var(--bg);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--acc-txt,var(--acc,var(--blue)));padding:8px}
.btn.bad{background:var(--bad);color:#fff}
.btn.good{background:var(--good);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.full{width:100%}
.btn.split{justify-content:space-between}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 11px;border-radius:20px;background:var(--card);font-size:12.5px;font-weight:600;border:1px solid var(--line)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 6px;border-radius:6px;background:var(--bg);color:var(--mute);letter-spacing:.02em;white-space:nowrap}
.tag.g{background:#e1f4ea;color:var(--good)}
.tag.r{background:#fde6e3;color:var(--bad)}
.tag.y{background:#fdf0d4;color:#8f5c00}
.tag.b{background:#e3f0fc;color:#1a64a8}
.tag.p{background:#efe6fb;color:#6b3fb0}
.tag.k{background:var(--ink);color:#fff}
.money{font-family:var(--f-disp);font-weight:400;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}
select.sel,input.inp{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px;font-size:14px;min-width:0}
input.inp{width:100%}
/* item rows */
.lcard{background:var(--card);border-radius:18px;padding:10px;display:grid;grid-template-columns:96px 1fr;gap:12px;text-align:left;align-items:center;width:100%}
.thumb{border-radius:13px;height:88px;display:grid;place-items:center;overflow:hidden;background:#ecebef}
.thumb svg,.photo svg{width:84%;height:auto;max-width:100%}
.li{display:grid;gap:3px;min-width:0}
.lt{font-weight:600;font-size:14px;line-height:1.25}
.lp{font-family:var(--f-disp);font-size:16px;font-variant-numeric:tabular-nums}
.lm{font-size:12px;color:var(--mute)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.photo{border-radius:20px;height:230px;display:grid;place-items:center;overflow:hidden;position:relative;background:#ecebef}
.photo svg{width:62%}
.photo .stk{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13.5px}
.spec div span{display:block;color:var(--mute);font-size:11.5px}
.seller{display:flex;gap:10px;align-items:center}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex-shrink:0;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:2px 0}
.kv>span:first-child{color:var(--mute)}
.kv>span:last-child{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
/* chats */
.thw{position:relative}
.thx{position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:1;width:30px;height:30px;border-radius:50%;background:var(--bg);color:var(--mute);font-size:18px;line-height:30px;text-align:center}
.th.hasx{padding-right:46px}
.th{background:var(--card);border-radius:16px;padding:10px 12px;display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%}
.th .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th .pv{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ub{background:var(--acc,#2a8bd9);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 7px}
.chat{display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;padding:8px 12px;border-radius:18px;font-size:14px;line-height:1.38;white-space:pre-line}
.bub.them{background:var(--card);align-self:flex-start;border-bottom-left-radius:6px}
.bub.me{background:var(--acc);color:var(--acc-ink,#fff);align-self:flex-end;border-bottom-right-radius:6px}
.bub.sys{align-self:center;background:transparent;color:var(--mute);font-size:12px;text-align:center;max-width:92%}
.bub:last-child{animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
.chatctx{background:var(--card);border-radius:16px;padding:8px;display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;text-align:left;width:100%}
.chatctx .thumb{height:52px}
.offer{display:grid;grid-template-columns:1fr auto;gap:8px}
/* tg */
.post{background:var(--card);border-radius:16px;padding:12px;display:grid;gap:8px;max-width:100%}
.post .pt{font-size:14px;line-height:1.45;white-space:pre-line}
.post .pm{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between}
.post .thumb{height:150px}
.post .thumb svg{width:auto;height:88%;max-width:90%}
.tgbg{background:#dfe8d6}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--bg);font-size:18px;font-weight:700}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums}
.filters2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters2 select{width:100%}
.szg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.szb{border:1px solid var(--line);border-radius:11px;padding:7px 4px;display:grid;gap:1px;text-align:center;background:var(--card)}.szb b{font-size:14px}.szb span{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}.szb.on{border-color:var(--ink);background:var(--ink);color:#fff}.szb.on span{color:rgba(255,255,255,.75)}
.liq{display:grid;grid-template-columns:1fr 46px 44px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.liq .bar{height:8px}
/* modal & banner */
#modal{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(12,10,16,.5)}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:20px 18px 34px;display:grid;gap:12px;max-height:90%;overflow:auto;animation:up .22s ease-out;--acc:var(--ink)}
.sheet h2{margin:0;font-family:var(--f-disp);font-weight:400;font-size:20px;text-wrap:balance}
.sheet p{margin:0;font-size:14px;line-height:1.48;color:#34313a}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:13px}
.seg button{padding:9px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;padding:6px 2px;text-align:left}
.chk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff;flex-shrink:0}
.chk.on i{background:var(--ink);border-color:var(--ink)}
.warn{background:#fdf0d4;color:#6e4700;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
.warn.r{background:#fde6e3;color:#8a1f17}
.big-verdict{font-family:var(--f-disp);font-size:34px;text-align:center;padding:10px 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#banner{position:absolute;top:48px;left:10px;right:10px;z-index:50;background:rgba(250,249,252,.97);border-radius:20px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.28);display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-align:left;animation:drop .3s ease-out}
#banner{touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none}
.bi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.bi svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#banner b{font-size:13px;display:block}
#pull{position:absolute;top:0;left:0;right:0;height:46px;z-index:30;touch-action:none;cursor:grab}
#nc{position:absolute;inset:0;z-index:55;background:rgba(16,14,22,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;display:flex;flex-direction:column;padding:52px 12px 0;will-change:transform;touch-action:none}
@keyframes ncin{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
.nc-h{display:flex;justify-content:space-between;align-items:center;padding:0 6px 12px;gap:8px}
.nc-h b{font-family:var(--f-disp);font-weight:400;font-size:22px}
.nc-list{flex:1;overflow-y:auto;display:grid;gap:8px;align-content:start;overscroll-behavior:contain}
.nc-i{touch-action:pan-y;cursor:pointer;user-select:none;-webkit-user-select:none;overflow:hidden;background:rgba(255,255,255,.12);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;text-align:left;color:#fff;width:100%;align-items:center}
.nc-i .t{font-size:13px;font-weight:700}.nc-i .x{font-size:12.5px;opacity:.85;line-height:1.35}.nc-i small{opacity:.55;font-size:11px;white-space:nowrap}
.nc-foot{flex-shrink:0;padding:12px 0 16px;cursor:grab}
.nc-grab{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);margin:0 auto 6px}
.nc-hint{text-align:center;font-size:11.5px;opacity:.55;margin-top:6px}
#banner small{display:block;font-size:11px;margin-top:2px}
#banner span{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px;display:grid;gap:10px;justify-items:center;line-height:1.45}
.stars{color:#f0a400;letter-spacing:1px}
.mission{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.mission .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:#fff}
.mission.done .ck{background:var(--good);border-color:var(--good)}
.mission.done .mn{color:var(--mute);text-decoration:line-through}
.sk{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--acc)}
.chart svg{width:100%;height:110px;display:block}
.ship{background:var(--card);border-radius:16px;padding:12px;display:grid;gap:8px}
.hero{background:var(--acc);color:var(--acc-ink,#fff);border-radius:20px;padding:16px;display:grid;gap:6px}
.hero .money{font-size:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"><div id="phone">
  <div id="screen"></div>
  <div id="status"></div>
  <div id="homebar"><button data-a="home" aria-label="Домой"></button></div>
  <div id="modal" hidden></div>
  <div id="banner" hidden role="button" tabindex="0" aria-label="Уведомление"></div>
  <div id="pull" aria-label="Потяни вниз — уведомления"></div>
  <div id="nc" hidden></div>
</div></div>

<script>
(()=>{

function mustPay(a,x){if(S.money<a){const need=Math.ceil((a-S.money)/1000)*1000;const ex=S.loans.find(L=>L.name==='Микрозайм');if(ex){ex.P+=need;ex.pay=annuity(ex.P,ex.r,2);earn(need,'Микрозайм: доплата')}else takeLoan(need,2,.1,'Микрозайм');dayLog.push(['Не хватило денег — банк выдал микрозайм',need]);notify('bank','Микрозайм '+rub(need),'Не хватило на «'+x+'». 10% в неделю — верни поскорее')}pay(a,x);dayLog.push([x,-a])}
function annuity(P,r,n){return Math.ceil(P*r/(1-Math.pow(1+r,-n))/10)*10}
function takeLoan(P,n,r,name){const L={id:uid(),name,P,r,n,pay:annuity(P,r,n),missed:0,t:S.t};S.loans.push(L);earn(P,name+' на '+n+' нед');return L}
function loanWeeksLeft(L){if(L.P<=0)return 0;const x=1-L.P*L.r/L.pay;return x<=0?99:Math.ceil(-Math.log(x)/Math.log(1+L.r)-1e-9)}
function loanWeek(L){const int=Math.round(L.P*L.r),p=Math.min(L.pay,Math.ceil(L.P+int));
 if(S.money>=p){pay(p,L.name+': платёж');L.P=Math.max(0,L.P+int-p);L.missed=0;dayLog.push([L.name+': платёж',-p])}
 else{L.missed++;const fine=Math.round(p*.1);L.P+=int+fine;dayLog.push([L.name+': просрочка! +'+rub(int+fine)+' к долгу',0]);notify('bank','Просрочка по кредиту','Проценты и штраф добавлены к долгу'+(L.missed>=2?'. Пришли коллекторы':''));
  if(L.missed>=2)collectors(L,p)}}
function collectors(L,need){let got=0;const taken=[];const I=S.items.slice().sort((a,b)=>estFor(b)-estFor(a));
 for(const it of I){if(got>=need)break;got+=Math.round(estFor(it)*.4/10)*10;taken.push(iName(it));S.items=S.items.filter(x=>x!==it);
  for(const t of S.threads)if((t.kind==='abuyer'||t.kind==='tbuyer')&&!t.closed&&t.b.item===it.id){msg(t,'sys','Вещь уже продана');t.closed=true}}
 const m=Math.min(S.money,Math.max(0,need-got));if(m>0){pay(m,'Коллекторы списали с карты');got+=m}
 L.P=Math.max(0,L.P-got);L.missed=0;dayLog.push(['Коллекторы забрали: '+(taken.join(', ')||'деньги с карты'),0])}

 const low=R()<(plat==='tg'?.12:.25);
 let max=base*gauss(1.02,.06)*(1+.015*S.sk.sales)*(.9+.02*rat);if(plat==='tg')max*=(.92+S.tg.trust/600);if(low)max*=.8;
 const price=it.sale.price;let offer,full=false;
 if(!low&&price<=max*.98&&R()<(plat==='tg'?.55:.35)){offer=price;full=true}else offer=rp(Math.min(price*.99,max*rnd(low?.75:.86,low?.86:.96)));
 if(offer>=price){offer=price;full=true}
 const th=newThread(plat==='tg'?'tbuyer':'abuyer',pick(NAMES),plat);th.sub=iName(it);
 th.b={item:it.id,max:rp(max),offer,pat:ri(2,4),agreed:false,low,exp:S.t+ri(48,72),price:0,lt:S.t};
 if(plat==='avito'&&S.stats.sold>=1&&R()<.06&&!it.sale.noPhish){th.b.phish=true;
  msg(th,'them','Здравствуйте! Беру за вашу цену. Я уже оплатил через Авитка Доставку 👍');msg(th,'them','Чтобы получить деньги, перейдите по ссылке и введите данные карты: avitka-dostavka-pay.ru/get');
  notify('avito/thread/'+th.id,th.name+' · '+iName(it),'Оплатил, просит перейти по ссылке');return}
 msg(th,'them',pick(['Здравствуйте! ','Привет! ','Добрый день! ','Здравствуйте, размер точно '+it.size+'? '])+(full?pick(['Беру за вашу цену. Как оплатить?','Цена ок, забираю!']):low?pick([`${rub(offer)} и забираю сегодня. Я сам перекуп, долго не думаю.`,`Отдай за ${rub(offer)}, всё равно висит.`]):pick([`Отдадите за ${rub(offer)}?`,`Готов взять за ${rub(offer)}.`,`${rub(offer)} — и по рукам?`,`Давайте за ${rub(offer)}, сразу оплачу.`])));
 notify((plat==='tg'?'tg':'avito')+'/thread/'+th.id,th.name+' · '+iName(it),full?'Готов купить за вашу цену':'Предлагает '+rub(offer))}
function finishSale(th,price){const it=getI(th.b.item);if(!it)return;const m=MODELS[it.m],plat=th.plat;
 const decl=it.sale.orig,fakeOrig=it.auth==='f'&&decl;
 const d={id:uid(),n:iName(it),size:it.size,cost:it.cost,price,prof:price-it.cost,plat,t:S.t,decl,auth:it.auth,buyer:th.name,it:JSON.parse(JSON.stringify(it))};d.it.sale=null;
 S.deals.unshift({...d});if(S.deals.length>150)S.deals.length=150;
 S.stats.sold++;S.stats.profit+=d.prof;S.stats.best=Math.max(S.stats.best,d.prof);if(m.tier==='lux')S.stats.lux++;if(fakeOrig)S.stats.fakeOrig++;
 S.items=S.items.filter(x=>x!==it);
 msg(th,'sys',plat==='avito'?`Отправлено Авитка Доставкой. Деньги придут после получения.`:`Покупатель перевёл ${rub(price)}. Отправлено СДЭКом.`);th.closed=true;
 for(const t of S.threads)if(t!==th&&(t.kind==='abuyer'||t.kind==='tbuyer')&&!t.closed&&t.b.item===it.id){msg(t,'sys','Вещь уже продана');t.closed=true}
 const pt=S.t+ri(20,40);
 if(plat==='avito')S.pend.push({t:pt,type:'payout',deal:d.id,amt:price});else earn(price,'Телега: '+d.n);
 const after=plat==='avito'?pt:S.t+ri(24,48);
 if(fakeOrig&&R()<pDetect(it)){if(plat==='avito'&&R()<.5)S.pend.push({t:pt-ri(2,8),type:'dispute',deal:d.id});else S.pend.push({t:after+ri(12,120),type:'claim',deal:d.id,plat})}
 else if(plat==='avito'&&R()<.04)S.pend.push({t:pt-1,type:'sizeret',deal:d.id});

 if(plat==='tg'){if(!decl)S.tg.trust=clamp(S.tg.trust-2,0,100);else S.tg.trust=clamp(S.tg.trust+1,0,100)}

   S.tg.posts.unshift({t:S.t,x:'💬 В комментариях скандал: подписчик пишет, что ему продали паль под видом оригинала.'});notify('tg','Скандал в канале',`Отписались ${lost} человек`)}}

function myRank(){const nw=netWorth();return 1+S.rivals.filter(r=>r.nw>nw).length}
function dropChance(){return clamp(.08+.012*S.lvl+.02*S.sk.conn+(S.tg.subs>=1000?.03:0),.08,.35)}
function newDrop(){const m=wpick(BRANDED.filter(x=>['shoes','hoodie','jacket','tee'].includes(x.cat)),x=>(x.tier==='lux'?.15:x.tier==='mass'?.3:1)*(.3+H(x.i)));
 const dw=dateObj().getDay(),dd=(6-dw+7)%7||7;
 S.drop={id:uid(),m:m.i,name:pick(DROPN),retail:rp(m.rt*.9),at:(dayOf()+dd)*24+12,entered:false,size:null,done:false};
 const D=S.drop;S.chan.drops.posts.unshift({id:uid(),t:S.t,x:`🎟 Раффл: ${m.b} ${m.n} ${D.name}\nЛимитированный релиз. Цена ${rub(D.retail)}, на ресейле уйдёт в разы дороже.\nЗапись до ${dateStr(D.at)}, 12:00. Взнос за участие 300 ₽.`});if(S.chan.drops.posts.length>20)S.chan.drops.posts.length=20;S.chan.drops.unread++;
 if(!S.flags.dropTip&&S.t>30){S.flags.dropTip=1;mentor('Видел раффлы в Телеге? Записываешься за 300 ₽, а если повезёт — берёшь лимитку по ретейлу и перепродаёшь вдвое дороже. Шанс небольшой, но растёт с уровнем и связями.')}}
function dropTick(){const D=S.drop;if(!D||D.done||S.t<D.at)return;D.done=true;const nm=MODELS[D.m].b+' '+MODELS[D.m].n+' '+D.name;
 S.chan.drops.posts.unshift({id:uid(),t:S.t,x:`🏁 Итоги раффла ${nm}: победителям пришли письма. Следующий раффл откроется в воскресенье.`});S.chan.drops.unread++;
 if(!D.entered)return;
 if(R()<dropChance()){if(S.money>=D.retail&&used()<capacity()){pay(D.retail,'Раффл: '+nm);const it=mkItem(D.m,{cond:0,auth:'o',k:'o',size:D.size,cost:D.retail+300,src:'Раффл',col:(D.m*3+1)%COLS.length});it.lim=S.t;it.liName=D.name;S.items.push(it);S.stats.drops++;
   notify('shkaf','Ты выиграл раффл! 🎉',nm+' · размер '+D.size+' уже в Шкафу');setTimeout(()=>modal(`<h2>Ты выиграл раффл!</h2><p>${esc(nm)}, размер ${D.size}. Выкупил по ретейлу за ${rub(D.retail)}.</p><div class="kv"><span>На ресейле сейчас</span><span>~${rub(valueOrig(it))}</span></div><p class="muted">Хайп на лимитку держится пару недель, потом цена сползает. Продавай, пока горячо.</p><button class="btn full" data-a="closeModal">Забрать</button>`),0)}
  else notify('tg','Раффл выигран, но…',S.money<D.retail?'Не хватило денег на выкуп — место ушло другому':'Шкаф забит — место ушло другому')}
 else notify('tg','Раффл: не повезло',nm+' · в следующий раз')}
function maybeOffer(){if(S.threads.filter(t=>t.kind==='deal'&&!t.closed).length>=2)return;if(R()>.2+.03*S.sk.conn)return;
 const type=wpick(['bag','lot','ward'],k=>k==='bag'?1:k==='lot'?(S.lvl>=2?.7:0):(S.lvl>=3?.8:0));let items=[],price,txt;
 if(type==='bag'){const n=ri(6,10),cap=Math.max(3000,netWorth()*.5),k=rnd(.6,.95);let sum=0,ps=[];for(let i=0;i<n;i++){const x=secItem(false);ps.push(x.p0);sum+=x.p0;items.push(x.it)}while(items.length>4&&sum*k>cap){items.pop();sum-=ps.pop()}price=rp(sum*k);
  txt=`Привет! Разбираю кладовку — мешок шмоток, штук ${items.length}. Что там, сам не знаю, вроде есть фирма. Отдам всё за ${rub(price)}.`}
 else if(type==='lot'){const cap=Math.max(12000,netWorth()*.6);let m,q,unit;for(let i=0;i<12;i++){m=wpick(BRANDED,x=>.1+H(x.i)*H(x.i));q=rnd(.55,.9);unit=rp(valueFake({m:m.i,cond:0,q})*rnd(.3,.5));if(unit*5<=cap)break}const n=clamp(Math.floor(cap/unit),3,10);price=unit*n;
  for(let i=0;i<n;i++)items.push(mkItem(m.i,{cond:0,auth:'f',k:'f',q:clamp(q+rnd(-.04,.04),.05,.97)}));
  txt=`Есть ${n} шт ${m.b} ${m.n} — реплика, качество хорошее. По ${rub(unit)} за штуку, только всё сразу: ${rub(price)}. Размеры вразброс.`}
 else{const n=ri(4,7);let sum=0;for(let i=0;i<n;i++){const m=wpick(BRANDED.filter(x=>x.tier==='street'||x.tier==='prem'),x=>.3+H(x.i));const it=mkItem(m.i,{cond:ri(0,2)});if(R()<.18){it.auth='f';it.q=rnd(.6,.92)}items.push(it);sum+=valueOrig(it)}
  const cap=Math.max(15000,netWorth()*.7);while(items.length>2&&sum*.5>cap){const x=items.pop();sum-=valueOrig(x)}
  price=rp(sum*rnd(.42,.62));txt=`Уезжаю, распродаю гардероб одним лотом:\n${items.map(it=>'• '+iName(it)+', '+sizeTxt(it)).join('\n')}\nВсё за ${rub(price)}, по одной не продаю. Забрать сегодня.`}
 const th=newThread('deal',pick(DEALPPL[type]),'tg');th.sub=type==='bag'?'мешок вещей':type==='lot'?'партия реплик':'гардероб';th.o={type,items,price,exp:S.t+ri(4,9),haggle:false};
 msg(th,'them',txt);notify('tg/thread/'+th.id,th.name,(type==='bag'?'Мешок вещей':type==='lot'?'Партия реплик':'Гардероб')+' за '+rub(price));
 if(!S.flags.dealTip){S.flags.dealTip=1;setTimeout(()=>mentor('Тебе в личку пишут с лотами? Мешки — лотерея: бывает пусто, бывает Стонник за копейки. Гардеробы обычно выгодные, но паль попадается и там.'),0)}}
function maybeOrder(){if(!S.tg.has||S.tg.subs<40)return;if(S.threads.filter(t=>t.kind==='order'&&!t.closed).length>=3)return;if(R()>.15+Math.min(.25,S.tg.subs/20000))return;

VIEWS.shkaf=(v,id)=>{if(v==='item')return shkItem(id);
 const tab=S.shkTab,I=S.items.filter(i=>tab==='all'||(tab==='sale'?i.sale:!i.sale));
 const tabs=`<div class="tabs"><button class="${tab==='all'?'on':''}" data-a="shkTab" data-s="all">Все · ${S.items.length}</button><button class="${tab==='sale'?'on':''}" data-a="shkTab" data-s="sale">В продаже</button><button class="${tab==='idle'?'on':''}" data-a="shkTab" data-s="idle">Лежат</button></div>`;

function shkItem(id){const it=getI(id);if(!it)return {t:'Вещь',b:'<div class="empty">Этой вещи больше нет</div>'};const m=MODELS[it.m];
 const vo=valueOrig(it),vf=valueFake(it),ths=S.threads.filter(t=>(t.kind==='abuyer'||t.kind==='tbuyer')&&!t.closed&&t.b.item===it.id);
 const acts=[];
 if(it.sale)acts.push(`<button class="btn" data-a="sellModal" data-id="${it.id}">Изменить объявление</button>`,`<button class="btn sec" data-a="unlist" data-id="${it.id}">Снять с продажи</button>`);else acts.push(`<button class="btn" data-a="sellModal" data-id="${it.id}">Выставить на продажу</button>`);
 if(it.sale&&it.sale.avito)acts.push(`<button class="btn sec btn split" data-a="boost" data-id="${it.id}" ${it.sale.boost>S.t?'disabled':''}><span>${it.sale.boost>S.t?'Поднято в поиске':'Поднять на Авитке на сутки'}</span><span>${rub(boostCost(it))}</span></button>`);
 if(it.sale&&it.sale.tg&&S.tg.has)acts.push(`<button class="btn sec" data-a="repost" data-id="${it.id}">Запостить в канал ещё раз</button>`);
 if(!m.noname&&!it.lc)acts.push(`<button class="btn sec btn split" data-a="legit" data-id="${it.id}"><span>Легит-чек · 1 ч</span><span>${rub(legitCost(it))}</span></button>`);
 if(!m.noname&&!it.look&&it.k==='?')acts.push(`<button class="btn sec" data-a="examine" data-id="${it.id}">Рассмотреть самому</button>`);
 if(it.prot>S.t&&it.k==='f'&&it.protDecl==='o')acts.push(`<button class="btn bad" data-a="dispute" data-id="${it.id}">Открыть спор и вернуть ${rub(it.paid)}</button>`);
 if(!it.ph)acts.push(`<button class="btn sec btn split" data-a="photo" data-id="${it.id}"><span>Фотосессия на белом фоне</span><span>${rub(500)}</span></button>`);
 if(it.cond===3&&!it.cl)acts.push(`<button class="btn sec btn split" data-a="clean" data-id="${it.id}"><span>${m.cat==='shoes'?'Чистка кроссовок':'Химчистка'} → «хорошее»</span><span>${rub(cleanCost(it))}</span></button>`);
 acts.push(`<button class="btn sec btn split" data-a="pawnAsk" data-id="${it.id}"><span>Сдать в скупку сразу</span><span>деньги сейчас</span></button>`);
 const b=`<div class="photo">${itemSVG(it)}<div class="stk">${authTag(it)}${it.lim?'<span class="tag p">Лимитка</span>':liqTag(it.m)}</div></div>
 <div class="card"><h3>${iName(it)}</h3><div class="spec"><div><span>Размер</span>${sizeTxt(it)}</div><div><span>Состояние</span>${COND[it.cond].n}</div><div><span>Сегмент</span>${TIER[m.tier].n}</div><div><span>Откуда</span>${esc(it.src||'—')}</div></div>
 <div class="kv"><span>Себестоимость</span><span>${rub(it.cost)}</span></div>
 <div class="kv"><span>На рынке как ориг</span><span>~${rub(vo)}</span></div>${m.noname?'':`<div class="kv"><span>Как реплика</span><span>~${rub(it.k==='o'?Math.round(vf/100)*100:vf)}</span></div>`}
 <div class="kv"><span>Ликвидность модели</span><span>${S.tg.pro>S.t||liq(it.m)>=85?liq(it.m)+'%':'смотри Хайп-радар'}</span></div>
 ${it.prot>S.t?`<div class="warn">Защита покупателя Авитки: ещё ${it.prot-S.t} ч. Продавец писал «${it.protDecl==='o'?'оригинал':'реплика'}». Если легит-чек покажет паль — можно открыть спор.</div>`:''}
 ${it.k==='?'&&!m.noname?'<div class="muted">Подлинность не проверена. Продашь паль как ориг — рискуешь рейтингом.</div>':''}</div>
 ${ths.length?`<div class="card"><h3>Покупатели</h3>${ths.map(t=>`<button class="btn sec full btn split" data-a="go" data-r="${t.plat}/thread/${t.id}"><span>${esc(t.name)} · ${t.plat==='tg'?'канал':'Авитка'}</span><span>${t.b.agreed?'договорились '+rub(t.b.price):rub(t.b.offer)}</span></button>`).join('')}</div>`:''}

 return {t:m.b+' '+m.n,b}}
const boostCost=it=>Math.round(clamp(99+it.sale.price*.01,99,1500)/10)*10;

 <div class="card"><h3>Взять кредит</h3><div class="muted">Доступно сейчас ${rub(max)}. Лимит зависит от уровня магазина и рейтинга: на ${S.lvl} ур. — до ${rub(loanCap())}, на ${S.lvl+1} ур. — до ${rub(LOANLIM[Math.min(S.lvl+1,LOANLIM.length-1)])}. Платёж каждый понедельник, равными частями.</div>

VIEWS.settings=()=>({t:'Настройки',b:`<div class="card"><h3>Как играть</h3><p class="muted" style="font-size:13.5px;line-height:1.55">
1. Покупай дешевле рынка: в Секонде (завоз раз в неделю, в понедельник к 10:00 — ликвид разбирают за пару часов; половина бренда там паль, а ассортимент растёт с уровнем), на Авитке, на Пойзоне и у поставщиков в Телеге.<br>
2. Следи за трендами в «Хайп-радаре». Ликвид продаётся за день, неликвид висит неделями. Сезон тоже важен: пуховики зимой, футболки летом.<br>
3. Паль бывает плохая (видно сразу) и «один в один». Проверяй легит-чеком в Шкафу. Товар с Авитки с доставкой можно вернуть через спор в течение 24 часов.<br>
4. Продавать паль как реплику — честно, но рейтинг немного просядет. Как оригинал — выгодно, но покупатель может проверить. Тогда 1★, жалоба, а после трёх жалоб — блок на Авитке.<br>
5. Выставляй в «Шкафу» на Авитку и в свой канал. Канал нужно вести: посты, реклама, розыгрыши.<br>
6. Время идёт само: 1 секунда — 1 игровая минута. Ждать можно с главного экрана. В 00:00 ты засыпаешь до 8:00.<br>
7. Каждый день 500 ₽ на жизнь. По понедельникам — аренда комнаты 5 000 ₽, платежи по кредитам и аренда складов. В минус карта не уходит: не хватит на обязательный платёж — банк сам выдаст дорогой микрозайм. Кредит новичку — до 5 000 ₽, лимит растёт с уровнем.<br>
8. По воскресеньям в Телеге открываются раффлы: запишись за 300 ₽, при победе выкупишь лимитку по ретейлу, а на ресейле она стоит вдвое дороже.<br>
9. В личку пишут с лотами (мешки, партии реплик, гардеробы), а подписчики канала — с заказами выше рынка.<br>
10. На Авитке объявления со временем опускаются в поиске — поднимай их. За 15+ отзывов и 4.8★ дают значок «Надёжный продавец».<br>
11. Обгони конкурентов в «Топе перекупов Москвы» в «Магазине». Финал — свой бренд.<br>
12. Опыт дают только отзывы покупателей: 5★ +35, 4★ +15, 3★ 0, 2★ −25, 1★ −60.<br>
13. Смахни баннер уведомления вверх, чтобы убрать его. Потяни вниз от верхнего края экрана — откроются все уведомления.</p></div>
<div class="card"><h3>Игра</h3><div class="muted">Прогресс сохраняется в этом браузере автоматически.</div><button class="btn bad" data-a="resetAsk">Начать заново</button></div>`});

function nVisible(n){const m=n.route&&n.route.match(/\/thread\/(\d+)/);if(m){const th=getT(m[1]);return S.t-n.t<48&&!!th&&!th.closed&&!th.hidden}return S.t-n.t<24}
function nPrune(){S.nlog=(S.nlog||[]).filter(nVisible)}
function ncHTML(){nPrune();const L=S.nlog;return `<div class="nc-h"><b>Уведомления</b>${L.length?'<button class="btn sm" style="background:rgba(255,255,255,.18);color:#fff" data-a="ncClear">Очистить</button>':''}</div><div class="nc-list">${L.map(n=>{const ap=n.route?(n.route.startsWith('chan:')?'tg':n.route.split('/')[0]):'settings',a=APP[ap]||APP.tg;return `<div class="nc-i" data-nid="${n.id}" role="button" tabindex="0"><div class="bi" style="background:${a.bg}">${icon(a.id)}</div><div style="min-width:0"><div class="row sp"><span class="t">${esc(n.title||a.n)}</span><small>${ago(n.t)}</small></div><div class="x">${esc(n.text)}</div></div></div>`}).join('')||'<div class="empty" style="color:rgba(255,255,255,.6)">Нет уведомлений</div>'}</div><div class="nc-foot"><div class="nc-grab"></div><div class="nc-hint">Смахни вверх — закрыть · влево или вправо — убрать уведомление</div></div>`}
function ncFill(){const n=$('#nc');n.innerHTML=ncHTML();ncBind()}
function ncSet(y,anim){const n=$('#nc');n.style.transition=anim?'transform .26s cubic-bezier(.2,.8,.2,1)':'none';n.style.transform=`translateY(${y}px)`}
function ncOpen(){const n=$('#nc');ncFill();n.hidden=false;ncSet(-n.offsetHeight,false);n.getBoundingClientRect();ncSet(0,true);hideBanner()}
function ncClose(fast){const n=$('#nc');if(n.hidden)return;if(fast){n.hidden=true;ncSet(0,false);return}ncSet(-n.offsetHeight,true);setTimeout(()=>{n.hidden=true;ncSet(0,false)},260)}
function ncRemove(el,dir){const id=+el.dataset.nid;el.style.transition='transform .2s ease, opacity .2s ease';el.style.transform=`translateX(${dir>0?120:-120}%)`;el.style.opacity='0';
 setTimeout(()=>{el.style.transition='max-height .18s ease, padding .18s ease';el.style.maxHeight=el.offsetHeight+'px';el.getBoundingClientRect();el.style.maxHeight='0px';el.style.paddingTop='0px';el.style.paddingBottom='0px';
  setTimeout(()=>{S.nlog=S.nlog.filter(n=>n.id!==id);save();el.remove();if(!S.nlog.length)ncFill()},190)},200)}
function ncBind(){for(const el of document.querySelectorAll('#nc .nc-i')){let x0=null,y0=0,dx=0,dy=0,horiz=false;
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;x0=e.clientX;y0=e.clientY;dx=dy=0;horiz=false;el.style.transition='none'});
 el.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;dy=e.clientY-y0;if(!horiz&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){horiz=true;try{el.setPointerCapture(e.pointerId)}catch(_){}}
  if(horiz){el.style.transform=`translateX(${dx}px)`;el.style.opacity=String(Math.max(.15,1-Math.abs(dx)/260))}});
 el.addEventListener('pointerup',()=>{if(x0==null)return;x0=null;
  if(horiz&&Math.abs(dx)>80)ncRemove(el,dx);
  else if(!horiz&&Math.abs(dx)<6&&Math.abs(dy)<6){const n=S.nlog.find(n=>n.id===+el.dataset.nid);ncClose(true);if(n&&n.route)goRoute(n.route)}
  else{el.style.transition='transform .2s ease, opacity .2s ease';el.style.transform='';el.style.opacity=''}});
 el.addEventListener('pointercancel',()=>{x0=null;el.style.transition='transform .2s ease, opacity .2s ease';el.style.transform='';el.style.opacity=''});
 el.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=S.nlog.find(n=>n.id===+el.dataset.nid);ncClose(true);if(n&&n.route)goRoute(n.route)}if(e.key==='Delete')ncRemove(el,1)})}}
A.ncClear=()=>{const els=[...document.querySelectorAll('#nc .nc-i')];els.forEach((el,i)=>setTimeout(()=>{el.style.transition='transform .2s ease, opacity .2s ease';el.style.transform='translateX(120%)';el.style.opacity='0'},i*35));setTimeout(()=>{S.nlog=[];save();ncFill()},els.length*35+220)};
function swipe(el,cap,onMove,onEnd){let y0=null,dy=0;
 el.addEventListener('pointerdown',e=>{if(e.button>0)return;y0=e.clientY;dy=0;if(cap){try{el.setPointerCapture(e.pointerId)}catch(_){}}});
 el.addEventListener('pointermove',e=>{if(y0==null)return;dy=e.clientY-y0;if(onMove)onMove(dy)});
 el.addEventListener('pointerup',()=>{if(y0==null)return;const d=dy;y0=null;onEnd(d)});
 el.addEventListener('pointercancel',()=>{y0=null;if(onMove)onMove(0)})}

 th.closed=true;th.unread=0;th.hidden=true;S.threads=S.threads.filter(x=>x!==th||x.kind==='aseller');save();render()};

 <div style="display:grid;gap:8px"><button class="btn sec full" data-a="waitM" data-h="1">Подождать час</button><button class="btn sec full" data-a="waitM" data-h="3">Подождать 3 часа</button>${h<19&&h>=7?`<button class="btn sec full" data-a="waitM" data-h="${19-h}">До 19:00</button>`:''}<button class="btn full" data-a="sleep">Спать до утра</button></div>`)};

A.openSellerChat=d=>{const l=getL(d.id);if(!l)return;const th=sellerThread(l);if(!th.msgs.length)msg(th,'sys',iName(l.it)+' · '+rub(l.ask));go('avito','thread',th.id)};
A.askSeller=d=>{const l=getL(d.id);if(!l)return;const s=l.seller,th=sellerThread(l),q=d.q,it=l.it;s.asked[q]=1;
 const Q={act:'Здравствуйте! Актуально?',orig:'Это оригинал?',photo:'Можете скинуть фото бирок и швов?',why:'Почему так дёшево?'};msg(th,'me',Q[q]);let a='';
 if(q==='act')a=s.type==='scam'?'Да, но быстро уходит. Могу забронировать по предоплате.':pick(['Да, актуально','Актуально 👍','Да, в наличии']);
 if(q==='orig')a={owner:it.auth==='o'?pick(['Да, брал в магазине','Ориг, конечно']):'Да, брал с рук, вроде ориг',reseller:'100% ориг, можем сделать легит-чек',mom:'Ой, не знаю. Сын носил, говорил, что фирма.',replica:'Нет, это реплика, качество 1:1. В описании указано.',liar:pick(['Конечно ориг, есть чек','Ориг 100%, брал в ЦУМе']),scam:'Оригинал, новый, с бирками'}[s.type];
 if(q==='photo'){l.photos=true;if(s.type==='scam'){a='Фото в объявлении, этого достаточно.';l.photoNote='Продавец не прислал фото'}else{
  const bad=it.auth==='f'&&R()<clamp((1-it.q)*.85+.05*S.sk.eye,0,.95);l.photoNote=bad?'На фото бирок кривой шрифт и неровные швы.':'Бирки и швы на фото выглядят нормально.';if(bad&&it.k==='?')it.hint='f';a='Скинул 📷'}
  msg(th,'them',a);msg(th,'sys',l.photoNote);save();render();return}
 if(q==='why')a={owner:'Да нормальная цена, просто не нужно.',reseller:'Это рынок, дешевле не найдёте.',mom:'Мне просто нужно освободить место.',replica:'Это реплика, поэтому дешевле оригинала.',liar:'Срочно нужны деньги, переезжаю.',scam:'Переезжаю за границу, нужно быстро продать.'}[s.type];
 msg(th,'them',a);save();render()};
A.offerSeller=d=>{const l=getL(d.id);if(!l)return;const x=parseNum($('#offer')&&$('#offer').value);if(x<100)return toast('Введи цену');sellerOffer(l,x);save();render()};
function sellerOffer(l,x){const s=l.seller,th=sellerThread(l);msg(th,'me',`Отдадите за ${rub(x)}?`);if(s.blocked)return;
 if(s.type==='scam'){msg(th,'them','Цена окончательная. Переведите на карту, и я сразу отправлю почтой.');th.scam=true;return}
 const minE=rp(s.min*(1-.015*S.sk.bargain));
 if(x>=s.cur){s.agreed=true;msg(th,'them',pick([`Договорились, ${rub(s.cur)}.`,`Ок, забирайте за ${rub(s.cur)}.`]))}
 else if(x>=minE){s.cur=x;s.agreed=true;msg(th,'them',pick([`Ладно, ${rub(x)}.`,`Хорошо, договорились на ${rub(x)}.`,`Эх, ну давайте ${rub(x)}.`]))}
 else{const gap=(minE-x)/l.ask;if(gap>.18){s.pat-=2;msg(th,'them',pick(['Вы серьёзно? Нет.','Смешно. Нет.','Неинтересно.','Это даже не торг.']))}
  else{s.pat-=1;const nc=rp(Math.max(minE,s.cur-(s.cur-x)*rnd(.3,.5)));s.cur=nc;msg(th,'them',pick([`Могу ${rub(nc)}, не меньше.`,`${rub(nc)} — и забирайте.`,`Минимум ${rub(nc)}.`]))}
  if(s.pat<=0){s.blocked=true;s.agreed=false;msg(th,'them',pick(['Всё, не пишите мне больше.','До свидания, торгуйтесь с кем-нибудь другим.']));msg(th,'sys','Продавец заблокировал вас');th.closed=true}}}
A.scamPay=d=>{const l=getL(d.id);if(!l)return;const p=l.seller.cur;if(!canPay(p))return;pay(p,'Перевод продавцу: '+iName(l.it));const th=sellerThread(l);
 msg(th,'me',`Перевёл ${rub(p)}`);msg(th,'sys','Пользователь удалил аккаунт.');th.closed=true;S.list=S.list.filter(x=>x!==l);S.stats.scammed++;
 mentor('Ты перевёл деньги на карту?! Это кидала: новый аккаунт, ноль отзывов, цена ниже рынка в два раза и отказ от Авитка Доставки. Считай, заплатил за науку.');save();render()};
A.buyDelivery=d=>{const l=getL(d.id);if(!l)return;const s=l.seller,th=sellerThread(l);
 if(s.blocked)return toast('Продавец тебя заблокировал');
 if(s.type==='scam'){msg(th,'me','Оформляю Авитка Доставку');msg(th,'them','Я не работаю через доставку, там комиссия. Переведите на карту, отправлю сразу.');th.scam=true;save();go('avito','thread',th.id);return}
 if(l.mode==='meet'){msg(th,'me','Можете отправить Авитка Доставкой?');msg(th,'them','Нет, только встреча у м. '+l.metro+'.');save();go('avito','thread',th.id);return}
 const price=s.cur,fee=Math.max(199,Math.round(price*.05)),tot=price+fee;
 if(used()>=capacity())return toast('Шкаф забит. Продай что-нибудь или купи место в «Магазине»');
 modal(`<h2>Авитка Доставка</h2><p>${esc(iName(l.it))} · ${sizeTxt(l.it)} · ${COND[l.it.cond].s}</p><div class="kv"><span>Цена</span><span>${rub(price)}</span></div><div class="kv"><span>Комиссия сервиса</span><span>${rub(fee)}</span></div><div class="kv"><span><b>Итого</b></span><span><b>${rub(tot)}</b></span></div><div class="muted">Придёт через 1–2 дня. После получения 24 часа на проверку: если продавец писал «оригинал», а это паль — вернёшь деньги через спор.</div><button class="btn full" style="background:#00a046" data-a="buyDeliveryOk" data-id="${l.id}">Оплатить ${rub(tot)}</button><button class="btn sec full" data-a="closeModal">Отмена</button>`)};
A.buyDeliveryOk=d=>{const l=getL(d.id);if(!l)return closeModal();const s=l.seller,price=s.cur,fee=Math.max(199,Math.round(price*.05)),tot=price+fee;if(!canPay(tot))return;

 if(used()+q>capacity())return toast(`Не влезет: свободно ${capacity()-used()} мест`);
 const plan=[];let tot=0;for(let i=0;i<q;i++){const sz=size==='mix'?pickSize(m.cat):size;const p=pzPrice(m,sz),unit=(opt?rp(p*.9):p)+ship;tot+=unit;plan.push([sz,unit])}
 if(!canPay(tot))return;pay(tot,`Пойзон: ${m.b} ${m.n} ×${q}`);
 const items=plan.map(([sz,unit])=>mkItem(m.i,{cond:0,auth:'o',k:'o',size:sz,col:(m.i*5)%COLS.length,cost:unit,src:'Пойзон'}));
 const days=rnd(pzEta()[0],pzEta()[1]);addShip(`Пойзон: ${m.b} ${m.n}${q>1?' ×'+q:''}`,items,days,{cn:true});S.stats.pzOrders++;if(q>=5)S.stats.bulk++;S.stats.bought+=q;S.ui.qty['pz'+m.i]=1;checkMissions();save();render();
 toast(`Заказ оформлен · приедет около ${dateStr(S.t+Math.round(days*24))}`)};
/* second */
A.secLook=d=>{const x=S.sec.items.find(y=>y.id===+d.id);if(!x)return;x.seen=true;const r=examine(x.it);save();render();toast(LOOKTXT[r])};

A.secBuy=d=>{const x=S.sec.items.find(y=>y.id===+d.id);if(!x)return;const h=hourOf();if(h<10||h>=21)return toast('Секонд закрыт');if(used()>=capacity())return toast('Шкаф забит');
 const price=Math.max(30,Math.round(x.p0*wdMult()/10)*10);if(!canPay(price))return;pay(price,'Секонд: '+iName(x.it));const it=x.it;it.cost=price;it.src='Секонд';it.bt=S.t;S.items.push(it);S.sec.items=S.sec.items.filter(y=>y!==x);S.stats.secBuys++;S.stats.bought++;checkMissions();save();render();toast('Куплено: '+iName(it))};

/* shkaf */


A.examine=d=>{const it=getI(d.id);if(!it)return;const r=examine(it);save();render();toast(LOOKTXT[r])};
A.legit=d=>{const it=getI(d.id);if(!it)return;const c=legitCost(it);if(!canPay(c))return;pay(c,'Легит-чек');advance(1);const r=legitResult(it,.97);it.k=r;it.lc=true;S.stats.legit++;checkMissions();save();render();
 modal(`<h2>Легит-чек</h2><div class="big-verdict ${r==='o'?'pos':'neg'}">${r==='o'?'ОРИГИНАЛ ✓':'ПАЛЬ ✗'}</div><p>${esc(iName(it))} · ${sizeTxt(it)}. Сервис проверяет по фото бирок, швов и кодов. Точность около 97%: суперкопии иногда проходят.</p>${r==='f'&&it.prot>S.t&&it.protDecl==='o'?'<div class="warn">Продавец писал «оригинал». Можно открыть спор в карточке вещи и вернуть деньги.</div>':''}<button class="btn full" data-a="closeModal">Понятно</button>`)};
A.dispute=d=>{const it=getI(d.id);if(!it||!(it.prot>S.t))return;earn(it.paid,'Авитка: возврат по спору');S.items=S.items.filter(x=>x!==it);save();render();go('shkaf','main',null,false);
 modal(`<h2>Спор выигран</h2><p>Авитка вернула ${rub(it.paid)}. Вещь уехала обратно продавцу ${esc(it.protName||'')}.</p><button class="btn full" data-a="closeModal">Отлично</button>`)};
A.photo=d=>{const it=getI(d.id);if(!canPay(500))return;pay(500,'Фотосессия');it.cost+=500;it.ph=1;save();render();toast('Фото как в журнале · покупатели пишут чаще')};
A.clean=d=>{const it=getI(d.id);const c=cleanCost(it);if(!canPay(c))return;pay(c,'Чистка');it.cost+=c;it.cond=2;it.cl=1;advance(3);render();toast('Как новенькое. Почти')};
A.pawnAsk=d=>{const it=getI(d.id);const v=it.auth==='f'?Math.round(valueFake(it)*.35/10)*10:Math.round(valueOrig(it)*.45/10)*10;
 modal(`<h2>Скупка</h2><p>Скупщик осмотрел ${esc(iName(it))}.${it.auth==='f'&&!MODELS[it.m].noname?' «Это паль, брат. Больше не дам.»':''}</p><div class="kv"><span>Предлагает</span><span>${rub(v)}</span></div><div class="kv"><span>Ты вложил</span><span>${rub(it.cost)}</span></div><button class="btn full" data-a="pawnOk" data-id="${it.id}" data-v="${v}">Сдать за ${rub(v)}</button><button class="btn sec full" data-a="closeModal">Не надо</button>`)};
A.pawnOk=d=>{const it=getI(d.id);if(!it)return closeModal();const v=+d.v;earn(v,'Скупка: '+iName(it));if(it.auth==='f'&&it.k!=='f'&&!MODELS[it.m].noname)it.k='f';
 for(const t of S.threads)if((t.kind==='abuyer'||t.kind==='tbuyer')&&!t.closed&&t.b.item===it.id){msg(t,'sys','Вещь уже продана');t.closed=true}
 S.items=S.items.filter(x=>x!==it);S.stats.profit+=v-it.cost;closeModal();save();go('shkaf','main',null,false);toast('Сдано за '+rub(v))};
A.sellModal=d=>{const it=getI(d.id);if(!it)return;S.ui.sm={id:it.id,orig:it.sale?it.sale.orig:it.k!=='f',av:it.sale?it.sale.avito:S.ban<=S.t,tg:it.sale?it.sale.tg:S.tg.has,price:it.sale?it.sale.price:0};sellModal()};
function sellModal(){const sm=S.ui.sm,it=getI(sm.id);if(!it)return closeModal();const m=MODELS[it.m];
 const base=sm.orig?valueOrig(it):valueFake(it);if(!sm.price)sm.price=rp(base*1.02);
 const warn=sm.orig&&it.k==='f'?'<div class="warn r">Ты знаешь, что это паль. Продавать её как оригинал — обман. Если покупатель проверит, получишь 1★, жалобу и, возможно, блок.</div>':sm.orig&&it.k==='?'&&!m.noname?'<div class="warn">Вещь не проверена. Если это паль, а ты продашь её как ориг — проблемы будут те же.</div>':!sm.orig&&!m.noname?'<div class="warn">Продажа реплик немного снижает рейтинг: покупатели ставят 3–4★, и магазин, торгующий палью, ценят меньше.</div>':'';
 modal(`<h2>${it.sale?'Изменить объявление':'Выставить на продажу'}</h2><p>${esc(iName(it))} · ${sizeTxt(it)} · ${COND[it.cond].s} · вложено ${rub(it.cost)}</p>
 ${m.noname?'':`<div class="seg"><button class="${sm.orig?'on':''}" data-a="smSet" data-k="orig" data-v="1">Оригинал</button><button class="${!sm.orig?'on':''}" data-a="smSet" data-k="orig" data-v="0">Реплика</button></div>`}${warn}
 <div class="muted">Рынок ${sm.orig?'оригиналов':'реплик'} сейчас: ~${rub(base)}</div>
 <div class="row wrap"><button class="chip" data-a="smPrice" data-v="${rp(base*.88)}">Быстро · ${rub(rp(base*.88))}</button><button class="chip" data-a="smPrice" data-v="${rp(base)}">Рынок · ${rub(rp(base))}</button><button class="chip" data-a="smPrice" data-v="${rp(base*1.15)}">Жадно · ${rub(rp(base*1.15))}</button></div>
 <input class="inp num" id="smPrice" data-i="smPrice" inputmode="numeric" value="${sm.price}" aria-label="Цена">
 <button class="chk ${sm.av?'on':''}" data-a="smSet" data-k="av" ${S.ban>S.t?'disabled':''}><i>${sm.av?'✓':''}</i>Авитка${S.ban>S.t?' (заблокирована)':''}</button>
 <button class="chk ${sm.tg?'on':''}" data-a="smSet" data-k="tg" ${S.tg.has?'':'disabled'}><i>${sm.tg?'✓':''}</i>Мой канал в Телеге${S.tg.has?` · ${fmtN(S.tg.subs)} подп.`:' (сначала создай)'}</button>
 <div class="muted" id="smHint">${sellHint(it,sm.price,sm.orig,sm.av,sm.tg)}</div>
 <button class="btn full" data-a="smOk" ${sm.av||sm.tg?'':'disabled'}>${it.sale?'Сохранить':'Опубликовать'}</button><button class="btn ghost" data-a="closeModal">Отмена</button>`)}
A.smSet=d=>{const sm=S.ui.sm;const i=$('#smPrice');if(i)sm.price=parseNum(i.value);if(d.k==='orig'){const nv=d.v==='1';if(nv!==sm.orig){sm.orig=nv;sm.price=0}}else{if(d.k==='av'&&S.ban>S.t)return;if(d.k==='tg'&&!S.tg.has)return;sm[d.k]=!sm[d.k]}sellModal()};
A.smPrice=d=>{S.ui.sm.price=+d.v;const i=$('#smPrice');i.value=d.v;$('#smHint').textContent=sellHint(getI(S.ui.sm.id),+d.v,S.ui.sm.orig,S.ui.sm.av,S.ui.sm.tg)};
A.smOk=()=>{const sm=S.ui.sm,it=getI(sm.id);const p=parseNum($('#smPrice').value);if(p<100)return toast('Укажи цену');
 const wasTg=it.sale&&it.sale.tg;if(it.sale){Object.assign(it.sale,{price:p,orig:sm.orig,avito:sm.av,tg:sm.tg})}else it.sale={price:p,orig:sm.orig,avito:sm.av,tg:sm.tg,t:S.t,boost:0,views:0,tgT:0};
 if(sm.tg&&!wasTg)tgPostItem(it);
 for(const th of S.threads)if((th.kind==='abuyer'||th.kind==='tbuyer')&&!th.closed&&th.b.item===it.id){if((th.kind==='abuyer'&&!sm.av)||(th.kind==='tbuyer'&&!sm.tg)){msg(th,'sys','Объявление снято');th.closed=true}else if(!th.b.agreed&&p<th.b.offer)th.b.offer=p}
 closeModal();save();render();toast('Опубликовано · покупатели пишут с 9 до 23')};
function tgPostItem(it){it.sale.tgT=S.t;S.tg.last=S.t;S.tg.posts.unshift({t:S.t,x:`${it.sale.orig?'🔥 В наличии':'⚡ Реплика, качество топ'}: ${iName(it)}\nРазмер ${sizeTxt(it)} · ${COND[it.cond].s}\n${rub(it.sale.price)} · пишите в личку`});if(S.tg.posts.length>60)S.tg.posts.length=60}
A.repost=d=>{const it=getI(d.id);if(!it||!it.sale)return;tgPostItem(it);save();render();toast('Запостил в канал')};
A.unlist=d=>{const it=getI(d.id);it.sale=null;for(const th of S.threads)if((th.kind==='abuyer'||th.kind==='tbuyer')&&!th.closed&&th.b.item===it.id){msg(th,'sys','Объявление снято');th.closed=true}save();render()};
A.boost=d=>{const it=getI(d.id);const c=boostCost(it);if(!canPay(c))return;pay(c,'Поднятие объявления');it.sale.boost=S.t+24;it.sale.up=S.t;save();render();toast('Объявление в топе на сутки')};

/* bank & shop */
A.dep=d=>{const v=+d.v;if(S.money<v)return;S.money-=v;S.dep+=v;save();render()};
A.depOut=()=>{S.money+=S.dep;S.dep=0;save();render()};
A.loanW=d=>{saveLoanAmt();S.ui.loan.w=+d.w;render()};
function saveLoanAmt(){const i=$('#loanAmt');if(i&&S.ui.loan)S.ui.loan.a=parseNum(i.value)}
A.loanMaxBtn=()=>{S.ui.loan.a=loanMax();render()};
A.loanTake=()=>{saveLoanAmt();const a=Math.min(S.ui.loan.a,loanMax());if(a<1000)return toast('Минимум 1 000 ₽');const [w,r]=LOANT.find(x=>x[0]===S.ui.loan.w)||LOANT[1];takeLoan(a,w,r,'Кредит');S.ui.loan.a=Math.min(5000,loanMax());save();render();toast('Деньги на карте: +'+rub(a))};
A.repayPart=d=>{const L=S.loans.find(x=>x.id===+d.id);if(!L)return;const i=$('#rp'+L.id);const v=Math.min(parseNum(i&&i.value),Math.ceil(L.P));if(v<=0)return toast('Укажи сумму');if(S.money<v)return toast('Не хватает денег на карте');pay(v,L.name+': досрочно');L.P=Math.max(0,L.P-v);if(L.P<1){S.loans=S.loans.filter(x=>x!==L);toast('Кредит закрыт')}else toast('Внесено '+rub(v));save();render()};
A.repayAll=d=>{const L=S.loans.find(x=>x.id===+d.id);if(!L)return;const v=Math.ceil(L.P);if(S.money<v)return toast('Не хватает денег на карте');pay(v,L.name+': погашение');S.loans=S.loans.filter(x=>x!==L);save();render();toast('Кредит закрыт')};
A.skill=d=>{if(!S.sp||S.sk[d.k]>=10)return;S.sp--;S.sk[d.k]++;save();render()};
A.buyStor=d=>{const s=STOR.find(x=>x.id===d.id);if(S.lvl<s.lvl)return;const c=s.p||s.rent;if(!canPay(c))return;pay(c,(s.p?'Покупка: ':'Аренда: ')+s.n);S.stor[s.id]=1;checkMissions();save();render();toast(s.n+' — готово')};
A.brand=()=>{if(S.lvl<15||S.money<3e6)return;pay(3e6,'Запуск своего бренда');S.flags.brand=1;checkMissions();save();render();
 modal(`<h2>Свой бренд</h2><p>Ты начинал с потёртой олимпийки, стоптанных Форсов и мутного Теч Флиса от брата. Теперь у тебя свой лейбл, и перекупы ждут твоих дропов.</p><p>Продано вещей: <b>${S.stats.sold}</b>. Прибыль: <b>${rub(S.stats.profit)}</b>. Дней в деле: <b>${dayOf()+1}</b>. Спалили на пали: <b>${S.stats.caught}</b> раз.</p><p>Игра продолжается. Рынок никуда не делся.</p><button class="btn full" data-a="closeModal">Дальше</button>`)};
A.resetAsk=()=>modal(`<h2>Начать заново?</h2><p>Весь прогресс удалится: деньги, вещи, канал, рейтинг.</p><button class="btn bad full" data-a="reset">Да, начать заново</button><button class="btn sec full" data-a="closeModal">Отмена</button>`);
A.reset=()=>{closeModal();newGame();S.flags.started=1;save();go(null)};
A.start=()=>{S.flags.started=1;closeModal();save();render()};

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.id==='modal')return;if(el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}});
{const bn=$('#banner');
 swipe(bn,true,dy=>{bn.style.transform=dy<0?`translateY(${dy}px)`:'';bn.style.opacity=dy<0?String(Math.max(.2,1+dy/120)):''},d=>{bn.style.transform='';bn.style.opacity='';if(d<-25)hideBanner();else if(d>40)ncOpen();else if(Math.abs(d)<8)A.bannerGo()});
 bn.addEventListener('keydown',e=>{if(e.key==='Enter')A.bannerGo()});
 const pl=$('#pull');let pulling=false;
 swipe(pl,true,dy=>{const n=$('#nc');if(dy>6){if(!pulling){pulling=true;ncFill();n.hidden=false;hideBanner()}ncSet(Math.min(0,dy-n.offsetHeight),false)}},
  d=>{const n=$('#nc');if(pulling){pulling=false;if(d>90)ncSet(0,true);else{ncSet(-n.offsetHeight,true);setTimeout(()=>{n.hidden=true;ncSet(0,false)},260)}}else if(Math.abs(d)<8)A.timeSheet()});
 const nc=$('#nc');let cy=null,cdy=0;
 nc.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('.nc-i')||e.target.closest('button'))return;cy=e.clientY;cdy=0;try{nc.setPointerCapture(e.pointerId)}catch(_){}});
 nc.addEventListener('pointermove',e=>{if(cy==null)return;cdy=Math.min(0,e.clientY-cy);ncSet(cdy,false)});
 nc.addEventListener('pointerup',()=>{if(cy==null)return;cy=null;if(cdy<-70)ncClose();else ncSet(0,true)});
 nc.addEventListener('pointercancel',()=>{cy=null;ncSet(0,true)});
 nc.addEventListener('keydown',e=>{if(e.key==='Escape')ncClose()})}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&!S.flags.bankrupt)closeModal()});
document.addEventListener('change',e=>{const el=e.target,c=el.dataset.c;if(!c)return;const f=S.filt;
 if(c==='fSort')f.sort=el.value;else if(c==='fModel')f.m=el.value;else if(c==='fSize')f.size=el.value;else if(c==='fMode')f.mode=el.value;else if(c==='pzTier')S.pzf.tier=el.value;else if(c==='pzSort')S.pzf.sort=el.value;else return;S.ui.lim=30;save();render()});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.i==='loanAmt'&&S.ui.loan){S.ui.loan.a=parseNum(el.value);const [w,r]=LOANT.find(x=>x[0]===S.ui.loan.w)||LOANT[1];const a=Math.max(1000,Math.min(S.ui.loan.a,loanMax()));const pp=annuity(a,r,w);const lp=$('#loanPay'),lo=$('#loanOver');if(lp)lp.textContent=rub(pp);if(lo)lo.textContent=rub(pp*w-a)}if(el.dataset.i==='smPrice'&&S.ui.sm){const sm=S.ui.sm;sm.price=parseNum(el.value);const h=$('#smHint');if(h)h.textContent=sellHint(getI(sm.id),sm.price,sm.orig,sm.av,sm.tg)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aq'){A.aSearch();return}if(e.key==='Enter'&&e.target.id==='pq'){A.pSearch();return}if(e.key==='Enter'&&e.target.id==='offer'){const b=e.target.parentElement.querySelector('[data-a]');if(b)b.click()}});

/* ================= BOOT ================= */
window.__game={get S(){return S},newGame,advance,A,netWorth,valueOrig,valueFake,buyP,rating,genBuyer,finishSale,myRank,orderMatch,MODELS};
if(!load()||!S||S.v!==6)newGame();
S.ui.stack=S.ui.stack||[];S.ui.qty=S.ui.qty||{};S.ui.pzSize=S.ui.pzSize||{};
render();
function updateClock(){const a=$('#sclock');if(a)a.textContent=clock();const b=$('#hclock');if(b)b.textContent=clock()}
setInterval(()=>{if(!S||!S.flags.started||S.flags.bankrupt||document.hidden||sleeping)return;S.mi=(S.mi||0)+1;
 if(S.mi>=60){S.mi=0;advance(1);if(hourOf()===0)return;const ae=document.activeElement;if(ae&&ae.closest&&ae.closest('#screen')&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){updateClock();return}render()}
 else updateClock()},1000);
if(!S.flags.started)modal(`<h2>Перекуп шмота</h2><p>Понедельник, сентябрь, 8 утра. На карте 5 000 ₽, в шкафу три поношенные вещи. Комната стоит 5 000 в неделю. В 10:00 завоз в секонде — не проспи.</p><p>Скупай дешёвое в секонде, на Авитке и в Китае, лови тренды в Телеге и продавай дороже. Цель — свой шоурум, а потом и свой бренд.</p><p>В Телеге ждёт Тимур, он расскажет базу.</p><button class="btn full" style="background:#7a46d6" data-a="start">Погнали</button>`);
})();
</script>
